stages:
  - build
  - image

variables:
  GOFLAGS: "-mod=readonly"
  GOPATH: "$CI_PROJECT_DIR/.go"

build:binary:
  stage: build
  image: golang:1.26
  parallel:
    matrix:
      - GOOS: linux
        GOARCH: [amd64, arm64]
  cache:
    key:
      files:
        - go.sum
    paths:
      - .go/pkg/mod/
  script:
    - CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH
      go build -trimpath -ldflags="-s -w"
      -o rss_gitlab_sync-$GOOS-$GOARCH .
  artifacts:
    name: "rss_gitlab_sync-$GOOS-$GOARCH-$CI_COMMIT_SHORT_SHA"
    paths:
      - rss_gitlab_sync-$GOOS-$GOARCH
    expire_in: 30 days

build:image:
  stage: image
  needs: []
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG
      variables:
        IMAGE_TAGS: "$CI_COMMIT_TAG"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        IMAGE_TAGS: "$CI_COMMIT_SHORT_SHA latest"
    - if: $CI_COMMIT_BRANCH
      variables:
        IMAGE_TAGS: "$CI_COMMIT_SHORT_SHA"
  before_script:
    - docker run --rm --privileged tonistiigi/binfmt --install all
    - docker buildx create --use --name multi
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - |
      TAG_ARGS=""
      for t in $IMAGE_TAGS; do
        TAG_ARGS="$TAG_ARGS --tag $CI_REGISTRY_IMAGE:$t"
      done
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        $TAG_ARGS \
        --push \
        .
