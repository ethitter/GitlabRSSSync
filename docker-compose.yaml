services:
  app:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config.yaml:/config/config.yaml
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
  db:
    image: 'redis:8-alpine'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
